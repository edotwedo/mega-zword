name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # test_gate diffs a fixed historical commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]" "psutil>=7" "Pillow>=10.1"
      - name: Verify POSIX fake CLI launchers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for cli in scripts/fake_cli/{claude,codex,grok,gemini} scripts/fake_agy/agy; do
            test -x "$cli" || { echo "Fake CLI is not executable: $cli"; exit 1; }
          done
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke test (fake AI CLIs, no paid calls)
        run: python scripts/smoke.py
