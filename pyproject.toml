[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megazword"
version = "0.1.0b1"
description = "One terminal tool that runs all your AI CLIs and picks the right model for each task."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
megazword = "megazword.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
megazword = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import each other as tests.*, and run against src/ without installing.
pythonpath = ["src", "."]
