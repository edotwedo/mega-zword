[build-system]
# >=77 is not a preference: `license = "LicenseRef-Proprietary"` below is a
# PEP 639 SPDX expression, and setuptools older than 77 rejects it outright
# ("project.license must be valid exactly by one definition"), so metadata
# generation fails before the package is built.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "megazword"
version = "0.1.0b1"
description = "One terminal tool that runs all your AI CLIs and picks the right model for each task."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "psutil>=7", "Pillow>=10.1", "pywinpty>=3; sys_platform == 'win32'"]
# B6b: the desktop window (WebView2 on Windows). Without it, an Edge/Chrome app window.
app = ["pywebview>=5"]
# Local face presence only; no model service or camera-image uploads.
camera = ["opencv-python>=4.8,<5"]
# Native Windows Terminal relay, process inventory and local owner matching.
workspace = ["psutil>=7", "pywinpty>=3; sys_platform == 'win32'", "opencv-python>=4.8,<5"]

[project.scripts]
megazword = "megazword.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
megazword = ["dashboard.html", "mz.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import each other as tests.*, and run against src/ without installing.
pythonpath = ["src", "."]
